# One-command demo stack. Defaults are dev-only; override MSSQL_SA_PASSWORD via env.
#
#   docker compose up -d        # starts SQL Server + API
#   curl http://localhost:5154/health
#   docker compose logs -f api
#   docker compose down -v      # also wipes the DB volume

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: boligmappa-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BoligmappaDev!2026}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: src/Boligmappa.Reminders.Api
      dockerfile: Dockerfile
    container_name: boligmappa-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sqlserver,1433;Database=BoligmappaReminders;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BoligmappaDev!2026};TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "5154:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8080/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mssql_data:
